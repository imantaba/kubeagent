name: fuzz

# Fuzzing is a search, not a check: it belongs on a schedule, not on every push.
# The seed corpus of every target replays on the normal `go test ./...` in CI, so
# a regression a past campaign found still fails a pull request immediately.
#
# `go test -fuzz` accepts exactly one target and one package per invocation,
# which is why this is a matrix of (package, target) pairs rather than one job.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Budget per target, as a Go duration (e.g. 120s, 10m)'
        required: false
        default: '120s'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/diagnose
            target: FuzzDetectors
          - package: ./internal/logscan
            target: FuzzClassify
          - package: ./internal/redact
            target: FuzzRedactURL
          - package: ./internal/redact
            target: FuzzRedactError
          - package: ./internal/dnshealth
            target: FuzzParseResponses
          - package: ./internal/controlplane
            target: FuzzParseReadyz
          - package: ./internal/certhealth
            target: FuzzCertAssess
          - package: ./internal/policy
            target: FuzzLoadPolicy
          - package: ./internal/policy
            target: FuzzEvaluatePolicy
          - package: ./internal/policy
            target: FuzzResolvePath
          - package: ./internal/glob
            target: FuzzGlob
          - package: ./internal/safetext
            target: FuzzLine
          - package: ./internal/dashboard
            target: FuzzDashboardRender
          - package: ./internal/alert
            target: FuzzEncodePagerDuty
          - package: ./internal/batchhealth
            target: FuzzBatchAnnotate
          - package: ./internal/rollouthealth
            target: FuzzRolloutAnnotate
          - package: ./internal/createhealth
            target: FuzzCreateAnnotate
          - package: ./internal/pvchealth
            target: FuzzPVCAssess
          - package: ./internal/hpahealth
            target: FuzzHPAAssess
          - package: ./internal/termhealth
            target: FuzzTermAssess
          - package: ./internal/clusterhealth
            target: FuzzClusterAssess
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Two attempts, because two different things can fail here and only one of
      # them is a finding. A real crasher is written to
      # <package>/testdata/fuzz/<target>/ and replays as a seed, so the second
      # attempt fails on it immediately — a retry cannot hide one. The other is a
      # race in Go's fuzzing coordinator: when the -fuzztime budget expires while
      # a worker RPC is still in flight, the run ends `--- FAIL: <target>` /
      # `context deadline exceeded` with no failing input and no corpus entry.
      # That is noise, and a nightly that cries wolf stops being read.
      - name: Fuzz ${{ matrix.target }}
        run: |
          for attempt in 1 2; do
            if go test ${{ matrix.package }} \
              -run '^$' \
              -fuzz '^${{ matrix.target }}$' \
              -fuzztime '${{ inputs.fuzztime || '120s' }}'; then
              exit 0
            fi
            echo "::warning::${{ matrix.target }} attempt $attempt failed"
          done
          exit 1

      # Scoped to this target's own corpus directory. The repository-wide glob
      # this replaces uploaded every committed seed in internal/, so a run that
      # found nothing still produced a non-empty "crashers-" artifact.
      - name: Upload any crasher
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashers-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/**
          if-no-files-found: ignore
