name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r website/requirements.txt
      - run: mkdocs build --strict -f mkdocs.yml -d ../_site
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          # The action's default is 10 minutes, which is how long it waits for
          # GitHub to finish deploying the artifact it already uploaded. That
          # was ample for years — v1.6.0 deployed in 3m28s — until the v1.7.0
          # release hit a congested day and timed out twice in a row, once
          # still queued and once mid-deploy. Nothing was wrong with the site:
          # a strict mkdocs build had already passed in the step above. Waiting
          # longer costs a runner minute on a bad day and saves a red release.
          timeout: 1800000
