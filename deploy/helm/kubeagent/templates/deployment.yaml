apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeagent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeagent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubeagent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeagent.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubeagent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kubeagent
          image: {{ include "kubeagent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /*
            The name for the cluster this daemon's own ServiceAccount reaches.
            watch.clusterName wins; multicluster.localName is the older spelling
            and still works, so a chart upgrade changes no rendered label.
          */}}
          {{- $localName := .Values.watch.clusterName | default .Values.multicluster.localName }}
          args:
            - "watch"
            - "--metrics-addr=:{{ .Values.metricsPort }}"
            - "--heartbeat={{ .Values.watch.heartbeat }}"
            - "--debounce={{ .Values.watch.debounce }}"
            {{- if .Values.watch.namespace }}
            - "--namespace={{ .Values.watch.namespace }}"
            {{- end }}
            {{- if .Values.multicluster.enabled }}
            {{- if not .Values.multicluster.existingSecret }}
            {{- fail "multicluster.existingSecret is required when multicluster.enabled is true (a kubeconfig carries the credentials for every cluster it names, so it must come from a Secret, never from values.yaml)" }}
            {{- end }}
            {{- if not .Values.multicluster.contexts }}
            {{- fail "multicluster.contexts must list at least one context when multicluster.enabled is true" }}
            {{- end }}
            {{- if not .Values.multicluster.secretKey }}
            {{- fail "multicluster.secretKey is required when multicluster.enabled is true" }}
            {{- end }}
            - "--kubeconfig=/etc/kubeagent/kubeconfig/{{ .Values.multicluster.secretKey }}"
            {{- range .Values.multicluster.contexts }}
            {{- if not . }}
            {{- fail "multicluster.contexts must not contain an empty entry when multicluster.enabled is true" }}
            {{- end }}
            - "--context={{ . }}"
            {{- end }}
            {{- if not $localName }}
            {{- fail "multicluster.localName (or watch.clusterName) is required when multicluster.enabled is true" }}
            {{- end }}
            - "--cluster-name={{ $localName }}"
            {{- if .Values.multicluster.includeLocal }}
            - "--include-local"
            {{- end }}
            {{- else if .Values.watch.clusterName }}
            {{- /*
              Single-cluster install. Without this the daemon falls back to its
              own default and every series reads cluster="local" — a label that
              says nothing once a second cluster exists.
            */}}
            - "--cluster-name={{ .Values.watch.clusterName }}"
            {{- end }}
            {{- if .Values.alerts.enabled }}
            - "--alert-format={{ .Values.alerts.format }}"
            {{- if .Values.alerts.repeat }}
            - "--alert-repeat={{ .Values.alerts.repeat }}"
            {{- end }}
            {{- end }}
            {{- if .Values.slo.enabled }}
            {{- $target := required "slo.target is required when slo.enabled is true" .Values.slo.target }}
            {{- $targetF := float64 $target }}
            {{- if or (le $targetF 0.0) (ge $targetF 100.0) }}
            {{- fail (printf "slo.target must be greater than 0 and less than 100 when slo.enabled is true (got %v)" $target) }}
            {{- end }}
            - "--slo-target={{ $target }}"
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - "--dashboard"
            {{- end }}
            {{- if .Values.explain.enabled }}
            {{- if not .Values.explain.existingSecret }}
            {{- fail "explain.existingSecret is required when explain.enabled is true (the API key and any endpoint URL are credentials and must come from a Secret, never from values.yaml)" }}
            {{- end }}
            {{- if and .Values.explain.endpointSecretKey (not .Values.explain.model) }}
            {{- fail "explain.model is required when explain.endpointSecretKey is set (a local endpoint has no default model name)" }}
            {{- end }}
            {{- if and (not .Values.explain.endpointSecretKey) (not .Values.explain.secretKey) }}
            {{- fail "explain.secretKey is required when explain.endpointSecretKey is empty (the Anthropic backend needs an API key)" }}
            {{- end }}
            {{- if lt (int .Values.explain.budget) 1 }}
            {{- fail (printf "explain.budget must be at least 1 model call per hour when explain.enabled is true (got %v)" .Values.explain.budget) }}
            {{- end }}
            - "--explain"
            - "--explain-cooldown={{ .Values.explain.cooldown }}"
            - "--explain-budget={{ .Values.explain.budget }}"
            {{- if .Values.explain.model }}
            - "--model={{ .Values.explain.model }}"
            {{- end }}
            {{- end }}
          env:
            - name: KUBEAGENT_WEBHOOK_TIMEOUT_SECONDS
              value: {{ .Values.webhookLatency.timeoutThreshold | quote }}
            {{- if .Values.diskUsage.enabled }}
            - name: KUBEAGENT_DISK_USAGE
              value: "true"
            - name: KUBEAGENT_DISK_THRESHOLD
              value: {{ .Values.diskUsage.threshold | quote }}
            {{- end }}
            {{- if .Values.kubeletHealth.enabled }}
            - name: KUBEAGENT_KUBELET_HEALTH
              value: "true"
            {{- end }}
            {{- if .Values.controlPlaneHealth.enabled }}
            - name: KUBEAGENT_CONTROL_PLANE_HEALTH
              value: "true"
            {{- end }}
            {{- if .Values.dnsHealth.enabled }}
            - name: KUBEAGENT_DNS_HEALTH
              value: "true"
            - name: KUBEAGENT_DNS_SERVFAIL_RATIO
              value: {{ .Values.dnsHealth.servfailRatio | quote }}
            {{- end }}
            {{- if .Values.certs.enabled }}
            - name: KUBEAGENT_CERTS
              value: "true"
            - name: KUBEAGENT_CERT_WARN_DAYS
              value: {{ .Values.certs.warnDays | quote }}
            {{- end }}
            {{- if .Values.alerts.enabled }}
            {{- /*
              PagerDuty authenticates with an integration key in the request
              body, where every other receiver authenticates with the URL
              itself. Same Secret shape either way — only the variable name
              changes, so an operator adds no new values to switch.
            */}}
            - name: {{ if eq .Values.alerts.format "pagerduty" }}KUBEAGENT_ALERT_ROUTING_KEY{{ else }}KUBEAGENT_ALERT_WEBHOOK{{ end }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "alerts.existingSecret is required when alerts.enabled is true" .Values.alerts.existingSecret | quote }}
                  key: {{ .Values.alerts.secretKey | quote }}
            {{- end }}
            {{- if .Values.explain.enabled }}
            {{- $explainSecret := required "explain.existingSecret is required when explain.enabled is true (the API key and any endpoint URL are credentials and must come from a Secret, never from values.yaml)" .Values.explain.existingSecret }}
            {{- if .Values.explain.endpointSecretKey }}
            - name: KUBEAGENT_EXPLAIN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ $explainSecret | quote }}
                  key: {{ .Values.explain.endpointSecretKey | quote }}
            {{- if .Values.explain.secretKey }}
            - name: KUBEAGENT_EXPLAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $explainSecret | quote }}
                  key: {{ .Values.explain.secretKey | quote }}
                  optional: true
            {{- end }}
            {{- else }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $explainSecret | quote }}
                  key: {{ .Values.explain.secretKey | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.multicluster.enabled }}
          volumeMounts:
            - name: cluster-kubeconfig
              mountPath: /etc/kubeagent/kubeconfig
              readOnly: true
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.multicluster.enabled }}
      volumes:
        - name: cluster-kubeconfig
          secret:
            secretName: {{ .Values.multicluster.existingSecret | quote }}
            defaultMode: 0400
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
