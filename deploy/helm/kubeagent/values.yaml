# Default values for the kubeagent watch daemon.

image:
  repository: imantaba/kubeagent
  # tag defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Single replica is enough: the daemon is read-only and side-effect-free.
replicaCount: 1

watch:
  # Namespace to watch. Empty = all namespaces (needs the cluster-scoped RBAC below).
  namespace: ""
  # Safety-net full re-evaluation interval (informers drive real-time detection).
  heartbeat: 60s
  # Coalescing window for change events.
  debounce: 2s

metricsPort: 8080

serviceAccount:
  create: true
  # If empty, a name is derived from the release.
  name: ""

rbac:
  # Create the read-only ClusterRole + binding (get/list/watch only). Required
  # for the daemon to watch the cluster.
  create: true

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Hardened by default: non-root, read-only root FS, all caps dropped.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

diskUsage:
  enabled: false
  threshold: "0.80"

kubeletHealth:
  enabled: false

controlPlaneHealth:
  enabled: false

dnsHealth:
  enabled: false
  servfailRatio: "0.05"

certs:
  enabled: false
  warnDays: "30"

webhookLatency:
  timeoutThreshold: 15

alerts:
  # Route watch transitions to an outbound webhook (one alert per broken object).
  # The URL is a credential, so it is never set here: point existingSecret at a
  # Secret that already holds it. The daemon stays read-only toward the cluster.
  enabled: false
  # json | slack | alertmanager
  format: json
  # Re-send interval for still-firing alerts. Empty = the format default
  # (4h, or 60s for alertmanager, which expires alerts after resolve_timeout).
  repeat: ""
  # Name of an existing Secret holding the webhook URL. Required when enabled.
  existingSecret: ""
  secretKey: webhook-url

slo:
  # Track an availability SLO and expose error-budget burn rate as metrics.
  # The SLI is time-weighted workload availability: the fraction of
  # workload-seconds in which a workload had no findings. Needs no extra RBAC —
  # it reads the evaluation the daemon already performs.
  enabled: false
  # Availability target as a percentage. Must be greater than 0 and less than 100.
  target: 99.9

# On-incident explanations. Off by default: this is the only feature that sends
# anything to a model endpoint. It performs no additional cluster reads and needs
# no additional RBAC — the model sees only findings the daemon already collected.
#
# The API key is NEVER a value here. A values file lands in Git, in
# `helm get values`, and in CI logs. Create a Secret and name it in
# existingSecret:
#
#   kubectl -n kubeagent create secret generic kubeagent-llm \
#     --from-literal=apiKey=<PLACEHOLDER>
explain:
  enabled: false
  # Model name. Required when endpoint is set; otherwise defaults to the
  # kubeagent default (claude-opus-4-8).
  model: ""
  # Minimum gap between explanations for the same object. 0 disables the
  # per-object gap, leaving budget as the only limit.
  cooldown: 1h
  # Model calls per hour, and the burst capacity.
  budget: 20
  # OpenAI-compatible endpoint for a local model, e.g.
  # "http://ollama.llm.svc.cluster.local:11434/v1". Empty selects Anthropic.
  endpoint: ""
  # Secret holding the API key. Required when enabled and endpoint is empty.
  existingSecret: ""
  # Key within that Secret. Read into ANTHROPIC_API_KEY when endpoint is empty,
  # and into KUBEAGENT_EXPLAIN_API_KEY when it is set.
  secretKey: apiKey
