# Default values for the kubeagent watch daemon.

image:
  repository: imantaba/kubeagent
  # tag defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Single replica is enough: the daemon is read-only and side-effect-free.
replicaCount: 1

watch:
  # Namespace to watch. Empty = all namespaces (needs the cluster-scoped RBAC below).
  namespace: ""
  # Safety-net full re-evaluation interval (informers drive real-time detection).
  heartbeat: 60s
  # Coalescing window for change events.
  debounce: 2s
  # Name for the cluster this daemon runs in. Becomes its `cluster` metric label
  # and the cluster field in /issues and /explanations. Empty = the daemon's own
  # default, "local" — which says nothing useful once a second cluster's metrics
  # land in the same Prometheus.
  #
  # Set it to whatever you call this cluster elsewhere, so a dashboard, an alert
  # and a kubeconfig context all name it the same thing.
  clusterName: ""

metricsPort: 8080

serviceAccount:
  create: true
  # If empty, a name is derived from the release.
  name: ""

rbac:
  # Create the read-only ClusterRole + binding (get/list/watch only). Required
  # for the daemon to watch the cluster.
  create: true

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Hardened by default: non-root, read-only root FS, all caps dropped.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

diskUsage:
  enabled: false
  threshold: "0.80"

kubeletHealth:
  enabled: false

controlPlaneHealth:
  enabled: false

dnsHealth:
  enabled: false
  servfailRatio: "0.05"

certs:
  enabled: false
  warnDays: "30"

webhookLatency:
  timeoutThreshold: 15

alerts:
  # Route watch transitions to an outbound webhook (one alert per broken object).
  # The URL is a credential, so it is never set here: point existingSecret at a
  # Secret that already holds it. The daemon stays read-only toward the cluster.
  enabled: false
  # json | slack | alertmanager
  format: json
  # Re-send interval for still-firing alerts. Empty = the format default
  # (4h, or 60s for alertmanager, which expires alerts after resolve_timeout).
  repeat: ""
  # Name of an existing Secret holding the webhook URL. Required when enabled.
  existingSecret: ""
  secretKey: webhook-url

slo:
  # Track an availability SLO and expose error-budget burn rate as metrics.
  # The SLI is time-weighted workload availability: the fraction of
  # workload-seconds in which a workload had no findings. Needs no extra RBAC —
  # it reads the evaluation the daemon already performs.
  enabled: false
  # Availability target as a percentage. Must be greater than 0 and less than 100.
  target: 99.9

# A read-only HTML dashboard at /dashboard on the metrics port: the URL you
# hand someone who asks what is broken right now. It renders only state the
# daemon already tracks, so it performs no extra cluster read and needs no
# extra RBAC. Separately, it makes no model call.
#
# It is UNAUTHENTICATED, exactly like /metrics and /issues on the same port,
# and kubeagent terminates no TLS. The Service is ClusterIP by default; keep it
# cluster-internal, or put an authenticating proxy in front of it.
dashboard:
  enabled: false

# On-incident explanations. Off by default: this is the only feature that sends
# anything to a model endpoint. It performs no additional cluster reads and needs
# no additional RBAC — the model sees only findings the daemon already collected.
#
# The API key is NEVER a value here. A values file lands in Git, in
# `helm get values`, and in CI logs. Create a Secret and name it in
# existingSecret:
#
#   kubectl -n kubeagent create secret generic kubeagent-llm \
#     --from-literal=apiKey=<PLACEHOLDER>
explain:
  enabled: false
  # Model name. Required when endpointSecretKey is set; otherwise defaults to
  # the kubeagent default (claude-opus-4-8).
  model: ""
  # Minimum gap between explanations for the same object. 0 disables the
  # per-object gap, leaving budget as the only limit.
  cooldown: 1h
  # Model calls per hour, and the burst capacity. At least 1.
  budget: 20
  # Name of an existing Secret holding the model credentials. Required when
  # enabled. Nothing here is set in values.yaml: an API key is a credential,
  # and so is a model endpoint URL, which can embed a token.
  existingSecret: ""
  # Key within existingSecret holding the API key. Read into ANTHROPIC_API_KEY
  # when endpointSecretKey is empty, and into KUBEAGENT_EXPLAIN_API_KEY when it
  # is set (where it is optional — a local model may need no key).
  secretKey: apiKey
  # Key within existingSecret holding an OpenAI-compatible endpoint URL, e.g.
  # "http://ollama.llm.svc.cluster.local:11434/v1". Setting this selects the
  # local backend and requires explain.model; empty selects Anthropic.
  endpointSecretKey: ""

# Watch several clusters from this one daemon. Each context in the mounted
# kubeconfig becomes its own informer set, tracker and set of metric series,
# labelled cluster="<context>", behind this single /metrics endpoint.
#
# The kubeconfig is NEVER a value here. A values file lands in Git, in
# `helm get values`, and in CI logs, and a kubeconfig carries the credentials for
# every cluster it names. Create a Secret and name it in existingSecret:
#
#   kubectl -n kubeagent create secret generic kubeagent-clusters \
#     --from-file=kubeconfig=<PLACEHOLDER>
#
# Each credential inside that kubeconfig MUST be read-only (get/list/watch).
# kubeagent issues no writes, but it cannot enforce that from inside the pod:
# a kubeconfig holding a cluster-admin token would give this daemon
# write-capable credentials it never uses but nonetheless holds.
multicluster:
  enabled: false
  # Name of an existing Secret holding the kubeconfig. Required when enabled.
  existingSecret: ""
  # Key within existingSecret holding the kubeconfig document.
  secretKey: kubeconfig
  # Contexts within that kubeconfig to watch. At least one is required when
  # enabled; each becomes a cluster label of the same name.
  contexts: []
  # Also watch the cluster this daemon runs in, through its ServiceAccount and
  # the ClusterRole below.
  includeLocal: true
  # The cluster label for that local cluster. watch.clusterName names the same
  # thing and takes precedence; this is the older spelling, kept working.
  localName: local
